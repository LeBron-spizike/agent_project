<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>FastAPI LangGraph Chat</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 900px;
      margin: 40px auto;
      background: #f5f5f5;
    }
    .box {
      background: white;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 16px;
    }
    input, textarea, button {
      width: 100%;
      margin-top: 8px;
      padding: 10px;
      box-sizing: border-box;
    }
    button {
      cursor: pointer;
    }
    #chat {
      min-height: 300px;
      background: #fafafa;
      padding: 12px;
      border: 1px solid #ddd;
      white-space: pre-wrap;
    }
    .user {
      color: #0b65c2;
      margin-top: 12px;
    }
    .assistant {
      color: #222;
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <h1>FastAPI + LangGraph 问答系统</h1>

  <div class="box">
    <h3>1. 登录</h3>
    <input id="email" value="user@example.com" placeholder="邮箱" />
    <input id="password" value="Password123!" placeholder="密码" type="password" />
    <button onclick="login()">登录并创建会话</button>
    <p id="status"></p>
  </div>

  <div class="box">
    <h3>2. 对话</h3>
    <div id="chat"></div>
    <textarea id="message" rows="3" placeholder="输入你的问题"></textarea>
    <button onclick="sendMessage()">发送</button>
  </div>

  <script>
    const API_BASE = "http://127.0.0.1:8000";
    let token = "";
    let sessionId = "";

    async function login() {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      const form = new URLSearchParams();
      form.append("email", email);
      form.append("password", password);
      form.append("grant_type", "password");

      const loginRes = await fetch(`${API_BASE}/api/v1/auth/login`, {
        method: "POST",
        headers: {
          "Content-Type": "application/x-www-form-urlencoded"
        },
        body: form
      });

      if (!loginRes.ok) {
        document.getElementById("status").innerText = "登录失败，请确认用户是否已注册";
        return;
      }

      const loginData = await loginRes.json();
      token = loginData.access_token;

      const sessionRes = await fetch(`${API_BASE}/api/v1/auth/session`, {
        method: "POST",
        headers: {
          "Authorization": `Bearer ${token}`
        }
      });

      const sessionData = await sessionRes.json();
      sessionId = sessionData.session_id;

      document.getElementById("status").innerText =
        `登录成功，session_id = ${sessionId}`;
    }

    async function sendMessage() {
      const input = document.getElementById("message");
      const content = input.value.trim();

      if (!token || !sessionId) {
        alert("请先登录并创建会话");
        return;
      }

      if (!content) {
        return;
      }

      const chatBox = document.getElementById("chat");
      chatBox.innerHTML += `\n<div class="user">用户：${content}</div>`;
      chatBox.innerHTML += `\n<div class="assistant">助手：</div>`;

      input.value = "";

      const res = await fetch(`${API_BASE}/api/v1/chatbot/chat`, {
        method: "POST",
        headers: {
          "Authorization": `Bearer ${token}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          session_id: sessionId,
          messages: [
            {
              role: "user",
              content: content
            }
          ]
        })
      });

      const data = await res.json();

      if (!res.ok) {
        chatBox.innerHTML += `\n请求失败：${JSON.stringify(data)}`;
        return;
      }

      const messages = data.messages;
      const assistantMessage = messages[messages.length - 1].content;

      const assistantBlocks = document.querySelectorAll(".assistant");
      assistantBlocks[assistantBlocks.length - 1].innerText =
        `助手：${assistantMessage}`;
    }
  </script>
</body>
</html>
